
<main class="login-page">

  <section class="login-card" aria-label="Inicio de sesión">

    <img
      class="login-card__avatar"
      src="images/avatar.png"
      alt="Usuario"
    />

    <form [formGroup]="formulario" (ngSubmit)="ingresar()">

      <div class="form-field">
        <span class="form-field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9v-2a8 8 0 0 1 16 0v2Z"/>
          </svg>
        </span>

        <input
          type="text"
          formControlName="userName"
          placeholder="Usuario"
          aria-label="Usuario"
          autocomplete="username"
        />
      </div>

      <div class="form-field">
        <span class="form-field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-7a3 3 0 0 0-3-3ZM10 6a2 2 0 0 1 4 0v2h-4Zm2 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
          </svg>
        </span>

        <input
          [type]="mostrarPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="Contraseña"
          aria-label="Contraseña"
          autocomplete="current-password"
        />

        
        <button
          type="button"
          class="password-toggle"
          (click)="mostrarPassword.set(!mostrarPassword())"
          [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (mostrarPassword()) {
            <!-- Ojo tachado -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M3 3l18 18" />
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
              <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9" />
              <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.9-.5" />
            </svg>
          } @else {
            <!-- Ojo abierto -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>

      </div>

      @if (error()) {
        <p class="login-error" role="alert">{{ error() }}</p>
      }

      <button
        class="login-button"
        type="submit"
        [disabled]="cargando()"
      >
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>

    </form>
  </section>
</main>
